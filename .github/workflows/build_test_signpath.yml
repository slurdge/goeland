name: Build for signpath

on: 
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # for the Release step
      actions: read     # lets the job read its own artifacts
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

    - name: Setup Golang
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.26
        
    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: 3.11.0
    
    - name: Get Go Deps
      run: go get -v ./...

    - name: Get version
      id: vars
      run: |
        echo "BUILD_DATE=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV
        echo "GIT_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
        echo "GIT_TAG=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV

    - name: Build
      env:
        IMGUR_CLIENT_ID: ${{ secrets.IMGUR_CLIENT_ID }}
      run: >-
        python3 gox.py 
        -osarch="linux/386 linux/amd64 linux/arm linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/386" 
        -output "build/{{.Dir}}_{{.OS}}_{{.Arch}}" 
        -ldflags "-w -s -X github.com/slurdge/goeland/version.GitCommit=$GIT_COMMIT -X github.com/slurdge/goeland/version.BuildDate=$BUILD_DATE -X github.com/slurdge/goeland/internal/goeland/fetch.clientID=$IMGUR_CLIENT_ID"

    - name: Upload artifact for SignPath
      id: upload-unsigned-artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: windows-unsigned
        path: build/*.exe
        if-no-files-found: error

    - name: Submit signing request
      uses: signpath/github-action-submit-signing-request@v3
      with:
        api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
        organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
        project-slug: 'goeland'
        signing-policy-slug: 'test-signing'
        github-artifact-id: '${{ steps.upload-unsigned-artifact.outputs.artifact-id }}'
        wait-for-completion: true
        output-artifact-directory: 'signed'

    - name: Replace unsigned exes with signed ones
      run: |
        ls -l signed
        cp -f signed/*.exe build/

    - name: Verify signatures
      run: |
        sudo apt-get install -y -qq osslsigncode
        for f in build/*.exe; do
          echo "== $f"
          osslsigncode verify -in "$f" || echo "::warning::$f did not verify (expected with the SignPath test certificate)"
        done

    - name: Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        append_body: true
        files: |
          ./build/*

