name: Docker images

on:
  push:
    branches:
      - "!*"
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

    - name: Get version
      id: vars
      run: |
        echo ::set-output name=BUILD_DATE::$(date +'%Y%m%d%H%M%S')
        echo ::set-output name=GIT_COMMIT::$(git rev-parse HEAD)
        echo ::set-output name=GIT_TAG::$(git describe --tags --abbrev=0)

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          slurdge/goeland
          ghcr.io/name/bar
    - name: Setup QEMU
      id: qemu
      uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4
      with:
        platforms: all

    - name: Available platforms
      run: echo ${{ steps.qemu.outputs.platforms }}

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

    - name: Login to Docker Hub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      id: docker_build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
        build-args: |
          BUILD_DATE=${{ steps.vars.outputs.BUILD_DATE }}
          GIT_COMMIT=${{ steps.vars.outputs.GIT_COMMIT }}
          IMGUR_CLIENT_ID=${{ secrets.IMGUR_CLIENT_ID }}
        platforms: linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v7,darwin/arm64,windows/amd64,windows/arm64
        push: ${{ startsWith(github.ref, 'refs/tags/') }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
    - name: Image digest
      run: echo ${{ steps.docker_build.outputs.digest }}
